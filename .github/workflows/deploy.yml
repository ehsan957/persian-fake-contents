name: Deploy to WordPress.org

# Publish a GitHub release tagged with the version (e.g. 2.0.0) to deploy,
# or run it manually from the Actions tab with the version to (re)deploy.
# Needs repository secrets SVN_USERNAME (wordpress.org username) and
# SVN_PASSWORD (the SVN password generated in your wordpress.org profile, not your login password).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (must match Version in grizzly.php and Stable tag in readme.txt)'
        required: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      PLUGIN_VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Check versions match
        run: |
          VERSION="${PLUGIN_VERSION#v}"
          echo "PLUGIN_VERSION=${VERSION}" >> "$GITHUB_ENV"
          grep -q "^ \* Version: *${VERSION}$" grizzly.php || { echo "grizzly.php Version is not ${VERSION}"; exit 1; }
          grep -q "^Stable tag: ${VERSION}$" readme.txt || { echo "readme.txt Stable tag is not ${VERSION}"; exit 1; }

      - name: Check SVN secrets
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          [ -n "$SVN_USERNAME" ] || { echo "Secret SVN_USERNAME is not set"; exit 1; }
          [ -n "$SVN_PASSWORD" ] || { echo "Secret SVN_PASSWORD is not set"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Build JavaScript
        run: npm ci && npm run build

      - name: Install Subversion
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion

      - name: Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: persian-fake-contents
          VERSION: ${{ env.PLUGIN_VERSION }}

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh release list --json tagName --jq '.[].tagName' | grep -E "^v?${PLUGIN_VERSION}$" | head -1)"
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" "${{ steps.deploy.outputs.zip-path }}" --clobber
          else
            echo "No GitHub release for ${PLUGIN_VERSION}; skipping zip upload."
          fi
